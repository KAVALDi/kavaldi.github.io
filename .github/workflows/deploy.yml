name: Публикация сайта

# Собирает сайт из content/ и выкладывает на GitHub Pages.
# Требует один раз переключить источник Pages на "GitHub Actions" (см. docs/PUBLISHING.md).
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 3 * * *' # раз в сутки обновляет календарь активности
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Календарь активности GitHub (сбой не останавливает публикацию)
        run: node src/cli.mjs activity || echo "::warning::Не удалось получить активность GitHub"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Оценки из GitHub Discussions (сбой не останавливает сборку)
        run: node src/cli.mjs feedback || echo "::warning::Оценки не получены. Блок оценок на сайте не показывается"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node src/cli.mjs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
